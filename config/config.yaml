# ============================================================
# TRAFFIC AI SYSTEM - CONFIGURATION
# Linh Nam Traffic Surveillance System
# ============================================================

system:
  name: "Traffic AI - Linh Nam"
  version: "1.0.0"
  device: "cuda"          # "cuda" hoặc "cpu"
  debug: false
  log_level: "INFO"

# --------------------------------------------------------
# VIDEO INPUT
# --------------------------------------------------------
video:
  source: "rtsp://admin:Thao_1234@192.168.1.195:554/cam/realmonitor?channel=1&subtype=0"   # path hoặc 0 (webcam) hoặc rtsp://...
  width: 1920
  height: 1080
  fps: 25
  # Vùng quan tâm (Region of Interest) - pixel coords [x1,y1,x2,y2]
  roi: [0, 200, 1920, 1080]

# --------------------------------------------------------
# YOLOv8 DETECTOR
# Tham chiếu báo cáo: Section 3.3.1
# --------------------------------------------------------
detector:
  model_path: "models/yolov8s.pt"
  confidence_threshold: 0.25
  iou_threshold: 0.5
  input_size: 640
  classes: [2, 3, 5, 7]
  use_tensorrt: false
  tensorrt_model_path: "models/yolov8n_fp16.engine"

# --------------------------------------------------------
# DeepSORT TRACKER
# Tham chiếu báo cáo: Section 3.3.2, λ=0.7
# --------------------------------------------------------
tracker:
  max_age: 20
  n_init: 2
  max_cosine_distance: 0.4
  nn_budget: 50
  lambda_motion: 0.7

# --------------------------------------------------------
# IPM - INVERSE PERSPECTIVE MAPPING
# Tham chiếu báo cáo: Section 2.2.1, 3.4.1
#
# CHIEN LUOC:
#   1) auto_calibrate_from_frame() - dung Vanishing Point + Lane lines
#   2) Neu fail: load file JSON da save (neu co)
#   3) Neu van fail: dung src_points/dst_points_m co dinh duoi day
# --------------------------------------------------------
ipm:
  # Bat/tat auto-calibration. Neu false: luon dung src_points fix.
  auto_calibrate: true

  # So frame moi lan thu re-calibrate (chi recalibrate khi homography xau)
  recalibrate_every: 300

  # Camera position: centered | offset_left | offset_right | high_oblique
  camera_position: "offset_right"

  # 4 diem moc tren anh goc (pixel) - thu tu OpenCV: TL, TR, BL, BR
  #   TL = top-left  (xa, trai)
  #   TR = top-right (xa, phai)
  #   BL = bottom-left  (gan, trai)
  #   BR = bottom-right (gan, phai)
  # Dung lam FALLBACK khi auto-calibrate that bai.
  src_points:
    - [700, 400]    # TL
    - [1200, 400]   # TR
    - [100, 900]    # BL
    - [1800, 900]   # BR

  # 4 diem tuong ung trong khong gian thuc (m), cung thu tu TL,TR,BL,BR
  # Khu vuc khao sat: rong 8m x dai 30m
  dst_points_m:
    - [0, 0]
    - [8, 0]
    - [0, 30]
    - [8, 30]

  # Ti le pixel/met cho BEV (isotropic - quan trong de bao toan goc, tham chieu 3.4.1)
  scale: 20.0

  # ROI crop truoc khi warp (tiet kiem RAM, tang toc)
  roi_enabled: true
  roi_margin: 50

  # Path luu/load calibration tu dong
  calibration_save_path: "outputs/ipm_calibration.json"

# --------------------------------------------------------
# FEATURE ENGINEERING
# Tham chiếu báo cáo: Section 3.4.1
# --------------------------------------------------------
features:
  state_dim: 5
  window_size: 25
  window_stride: 5
  aggregation_stats: ["mean", "std", "max", "min"]
  interaction_radius: 5.0

# --------------------------------------------------------
# LIGHTGBM CLASSIFIER
# Tham chiếu báo cáo: Section 3.4.2
# --------------------------------------------------------
classifier:
  model_path: "models/lgbm_accident.pkl"
  params:
    objective: "binary"
    num_leaves: 31
    max_depth: 5
    learning_rate: 0.05
    feature_fraction: 0.8
    n_estimators: 1000
    early_stopping_rounds: 50
    verbose: -1
  accident_threshold: 0.65
  feature_dim: 20

# --------------------------------------------------------
# ALERT SYSTEM
# --------------------------------------------------------
alert:
  cooldown_seconds: 5.0
  save_clip_seconds: 10
  output_dir: "outputs/"

# --------------------------------------------------------
# VISUALIZATION
# --------------------------------------------------------
visualization:
  show_fps: true
  show_track_id: true
  show_trajectory: true
  trajectory_length: 15
  show_bev: true
  show_confidence: true
  colors:
    normal: [0, 255, 0]
    warning: [0, 165, 255]
    accident: [0, 0, 255]
    trajectory: [255, 255, 0]

memory:
  tensorrt_workspace_gb: 1
  max_batch_size: 1
  pin_memory: false