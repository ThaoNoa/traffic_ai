# ============================================================
# TRAFFIC AI SYSTEM - CONFIGURATION
# Linh Nam Traffic Surveillance System
# ============================================================

system:
  name: "Traffic AI - Linh Nam"
  version: "1.0.0"
  device: "cuda"          # "cuda" hoặc "cpu"
  debug: false
  log_level: "INFO"

# --------------------------------------------------------
# VIDEO INPUT
# --------------------------------------------------------
video:
  source: "videos/linh_nam.mp4"   # path hoặc 0 (webcam) hoặc rtsp://...
  width: 1920
  height: 1080
  fps: 25
  # Vùng quan tâm (Region of Interest) - pixel coords [x1,y1,x2,y2]
  roi: [0, 200, 1920, 1080]

# --------------------------------------------------------
# YOLOv8 DETECTOR  
# Tham chiếu báo cáo: Section 3.3.1
# --------------------------------------------------------
detector:
  model_path: "models/yolov8s.pt"
  confidence_threshold: 0.25
  iou_threshold: 0.5
  input_size: 640        # ← Giảm từ 640 xuống 416 (tiết kiệm ~40% VRAM)
  classes: [2, 3, 5, 7]
  use_tensorrt: false
  tensorrt_model_path: "models/yolov8n_fp16.engine"

# --------------------------------------------------------
# DeepSORT TRACKER
# Tham chiếu báo cáo: Section 3.3.2, λ=0.7
# --------------------------------------------------------
tracker:
  max_age: 20              # Tăng từ 30 lên 60 (1.4s @ 42FPS) - xử lý occlusion
  n_init: 2              # Số frame để confirm track mới
  max_cosine_distance: 0.4
  nn_budget: 50
  # λ=0.7: trọng số Mahalanobis vs Cosine
  # (trong deep_sort_realtime, điều chỉnh qua max_cosine_distance)
  lambda_motion: 0.7       # Custom param - xem giải thích trong tracker module

# --------------------------------------------------------
# IPM - INVERSE PERSPECTIVE MAPPING
# Tham chiếu báo cáo: Section 2.2.1, 3.4.1
# --------------------------------------------------------
ipm:
  calibration_mode: "auto"
  recalibrate_every: 300
  
  # Fallback manual points (khi auto fail)
  src_points:
    - [100, 150]
    - [620, 150]
    - [50, 1200]
    - [670, 1200]
  
  dst_points:
    - [0, 0]
    - [20, 0]
    - [0, 60]
    - [20, 60]
  
  scale: 20.0
  roi_enabled: true
  roi_margin: 50

# --------------------------------------------------------
# FEATURE ENGINEERING
# Tham chiếu báo cáo: Section 3.4.1
# --------------------------------------------------------
features:
  # State vector per vehicle: [vt, at, theta_t, delta_theta_t, interaction_dist]
  state_dim: 5
  # Sliding window
  window_size: 25         # frames (≈1 giây @ 25FPS)
  window_stride: 5        # frames
  # Statistical aggregation → 20-dim vector (5 features × 4 stats)
  aggregation_stats: ["mean", "std", "max", "min"]
  # Interaction distance threshold (mét)
  interaction_radius: 5.0

# --------------------------------------------------------
# LIGHTGBM CLASSIFIER
# Tham chiếu báo cáo: Section 3.4.2
# --------------------------------------------------------
classifier:
  model_path: "models/lgbm_accident.pkl"
  # Hyperparameters (từ báo cáo)
  params:
    objective: "binary"
    num_leaves: 31
    max_depth: 5
    learning_rate: 0.05
    feature_fraction: 0.8
    scale_pos_weight: 450    # Tỷ lệ normal:accident ≈ 450:1
    n_estimators: 1000
    early_stopping_rounds: 50
    verbose: -1
  # Decision threshold
  accident_threshold: 0.65
  # Feature dim: window_size × state_dim × 4 stats = 20
  feature_dim: 20

# --------------------------------------------------------
# ALERT SYSTEM
# --------------------------------------------------------
alert:
  cooldown_seconds: 5.0    # Không spam alert
  save_clip_seconds: 10    # Lưu clip trước/sau sự cố
  output_dir: "outputs/"

# --------------------------------------------------------
# VISUALIZATION
# --------------------------------------------------------
visualization:
  show_fps: true
  show_track_id: true
  show_trajectory: true
  trajectory_length: 15    # frames
  show_bev: true           # Hiện Bird's Eye View
  show_confidence: true
  # Màu sắc (BGR)
  colors:
    normal: [0, 255, 0]      # Xanh lá
    warning: [0, 165, 255]   # Cam
    accident: [0, 0, 255]    # Đỏ
    trajectory: [255, 255, 0] # Vàng

memory:
  tensorrt_workspace_gb: 1   # ← Giảm từ 2GB xuống 1GB
  max_batch_size: 1          # ← Inference từng frame, không batch
  pin_memory: false          # ← Tắt với 4GB VRAM